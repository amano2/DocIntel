name: DocIntel Continuous Integration & DevOps Quality Guardrails

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. Backend Linting & Syntax Verification
  # ----------------------------------------------------------------------------
  backend-quality:
    name: Backend Syntax & Imports Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils libgomp1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with Ruff
        run: |
          # Enforce clean syntax and prevent broken imports
          ruff check src/ api/ --select=E9,F63,F7,F82 --show-source

      - name: Verify Python Compilation
        run: |
          python -m compileall src/ api/

  # ----------------------------------------------------------------------------
  # 2. Frontend Strict TypeScript & Vite Bundle Check
  # ----------------------------------------------------------------------------
  frontend-quality:
    name: Frontend TypeCheck & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Production SPA Bundle
        run: npm run build

  # ----------------------------------------------------------------------------
  # 3. Docker Compose & Container Packaging Guardrails
  # ----------------------------------------------------------------------------
  container-validation:
    name: Dockerfile & Orchestration Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container (Dry-Run / Cache Only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: docintel-backend:ci-test

      - name: Build Frontend Container (Dry-Run / Cache Only)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: docintel-frontend:ci-test
