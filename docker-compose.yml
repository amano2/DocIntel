# ==============================================================================
# DocIntel Multimodal Document Intelligence Platform
# Docker Compose Orchestration & Production Scaling Guardrails
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # FastAPI Multimodal Ingestion, Extraction, Anomaly & RAG Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docintel-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openrouter/free}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - PORT=8000
    volumes:
      # Persistent storage: audit trail DB, FAISS vector store, and document uploads
      - ./db:/app/db
      - ./vector_store:/app/vector_store
      - ./data/uploads:/app/data/uploads
    # Safe Scaling Guardrails: Prevent pipeline crashes or host OOM faults
    deploy:
      resources:
        limits:
          cpus: "2.5"
          memory: 3072M
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 40s
    networks:
      - docintel-network

  # ----------------------------------------------------------------------------
  # React + Tailwind SPA Frontend served by High-Performance Nginx
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docintel-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    # Strict dependency: Frontend only routes after backend passes health checks
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - docintel-network

networks:
  docintel-network:
    driver: bridge
